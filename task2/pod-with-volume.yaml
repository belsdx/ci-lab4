apiVersion: v1
kind: Pod
metadata:
  name: volume-demo
  labels:
    app: volume-demo
spec:
  containers:
    - name: writer
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Hello from volume" > /data/hello.txt
          sleep 3600
      volumeMounts:
        - name: demo-volume
          mountPath: /data
    - name: reader
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          sleep 5
          cat /data/hello.txt
          sleep 3600
      volumeMounts:
        - name: demo-volume
          mountPath: /data
  volumes:
    - name: demo-volume
      emptyDir: {}
